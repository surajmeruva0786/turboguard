seed: 42

model:
  name: turboguard_cnn
  n_channels: 3
  n_classes: 5
  dropout: 0.4

training:
  optimizer: adamw
  weight_decay: 1.0e-4
  lr: 1.0e-3
  lr_schedule: cosine_warmup
  warmup_epochs: 5
  batch_size: 32
  epochs: 120
  early_stopping_patience: 20
  amp: true

augmentation:
  time_shift_pct: 0.05
  amplitude_scale_std: 0.05
  noise_snr_db: 30

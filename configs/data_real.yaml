# Real-data variant of configs/data.yaml (roadmap: post-v0.1.0 real-dataset
# run). Points both datasets at their real, downloaded directories instead
# of the committed synthetic stand-ins. Requires:
#   python scripts/download_cwru.py --output_dir data/raw/cwru
#   python scripts/download_ims.py --output_dir data/raw/ims
# configs/data.yaml (synthetic) is left untouched — CI and the default
# dashboard demo still run against synthetic data.
cwru:
  source: real
  synthetic_dir: data/raw/cwru/synthetic
  real_dir: data/raw/cwru
  processed_dir: data/processed/cwru_real

# Real IMS is 3 separate run-to-failure experiments (1st_test/2nd_test/
# 3rd_test), not one pool like CWRU's per-condition files. 2nd_test is used
# here: smallest (984 snapshots x 4 bearings), and its one diagnosed fault
# (bearing 1, outer race - see src/data/ims_loader.py IMS_REAL_FAULT_LABELS,
# sourced from the dataset's own bundled Readme) is a well-documented case
# in the literature. real_dir must point directly at the extracted test-set
# directory; test_set tells the loader how to interpret its column layout.
ims:
  source: real
  synthetic_dir: data/raw/ims/synthetic
  real_dir: data/raw/ims/2nd_test
  test_set: 2
  processed_dir: data/processed/ims_real

window:
  window_seconds: 1.0
  overlap: 0.5
  target_sample_rate_hz: 12000
  n_channels: 3
  sequence_length: 10

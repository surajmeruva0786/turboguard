model: turboguard_hybrid
dataset_fault: cwru
dataset_rul: ims
data_config: configs\data_real.yaml
n_classes: 5
seq_len: 10
epochs: 20
batch_size: 32
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 2
fault_weight: 1.0
rul_weight: 0.5
augment: true
seed: 42
output_dir: runs\hybrid_real
data_config_resolved:
  cwru:
    source: real
    synthetic_dir: data/raw/cwru/synthetic
    real_dir: data/raw/cwru
    processed_dir: data/processed/cwru_real
  ims:
    source: real
    synthetic_dir: data/raw/ims/synthetic
    real_dir: data/raw/ims/2nd_test
    test_set: 2
    processed_dir: data/processed/ims_real
  window:
    window_seconds: 1.0
    overlap: 0.5
    target_sample_rate_hz: 12000
    n_channels: 3
    sequence_length: 10

services:
  dashboard:
    build: .
    image: turboguard:latest
    command: ["dashboard"]
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
